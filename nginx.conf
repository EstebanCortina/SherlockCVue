server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    
    location / {
        index index.html;
        try_files $uri /index.html;
    }
    include mime.types;
    types {
        application/javascript js mjs;
    }

    location ~* \.(mjs|min\.mjs)$ {
        default_type application/javascript;
    }
}
